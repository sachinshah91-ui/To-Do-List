<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TaskTracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:     #f5f5f5;
  --white:  #ffffff;
  --border: #e2e2e2;
  --border2:#c8c8c8;
  --text:   #111111;
  --text2:  #555555;
  --text3:  #999999;
  --accent: #2563eb;
  --accent-l:#eff6ff;
  --font: 'Inter', system-ui, sans-serif;
  --r: 6px;
  --sh: 0 1px 3px rgba(0,0,0,.08);
  --sh2: 0 4px 16px rgba(0,0,0,.12);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh}
button,input,select,textarea{font-family:var(--font)}
::-webkit-scrollbar{height:5px;width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:10px}

/* LOADING */
.ls{position:fixed;inset:0;background:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .3s;gap:10px}
.ls.hide{opacity:0;pointer-events:none}
.ls-icon{font-size:32px}
.ls-txt{font-size:13px;color:var(--text3)}
.ls-bar{width:120px;height:2px;background:var(--border);border-radius:2px;overflow:hidden}
.ls-fill{height:100%;background:var(--accent);animation:lp 1.2s ease-in-out infinite}
@keyframes lp{0%{width:0;margin-left:0}50%{width:80px}100%{width:0;margin-left:120px}}

.shell{display:flex;flex-direction:column;min-height:100vh}

/* HEADER */
.header{
  background:var(--white);border-bottom:1px solid var(--border);
  padding:0 20px;height:52px;
  display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:50;box-shadow:var(--sh);
}
.logo{display:flex;align-items:center;gap:8px}
.logo-sq{width:28px;height:28px;background:var(--accent);border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--white);font-size:14px;font-weight:700;flex-shrink:0}
.logo-txt{font-size:15px;font-weight:700;color:var(--text)}
.header-mid{flex:1;max-width:400px}
.sw{position:relative}
.sw .si{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px;pointer-events:none}
#search{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:6px 10px 6px 28px;font-size:13px;color:var(--text);outline:none;transition:all .15s}
#search:focus{background:var(--white);border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
#search::placeholder{color:var(--text3)}
.header-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.sync-pill{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text3);background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:3px 10px;white-space:nowrap}
.sd{width:6px;height:6px;border-radius:50%;background:var(--text3);flex-shrink:0;transition:background .3s}
.sd.ok{background:#16a34a}.sd.busy{background:#d97706;animation:pulse .7s ease-in-out infinite}.sd.err{background:#dc2626}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:var(--r);font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .14s;white-space:nowrap}
.btn-primary{background:var(--accent);color:var(--white)}.btn-primary:hover{background:#1d4ed8}
.btn-ghost{background:none;color:var(--text2);border:1px solid var(--border)}.btn-ghost:hover{background:var(--bg);color:var(--text)}
.btn-sm{padding:5px 10px;font-size:12px}

/* TOOLBAR */
.toolbar{
  background:var(--white);border-bottom:1px solid var(--border);
  padding:0 20px;height:44px;
  display:flex;align-items:center;gap:8px;
  overflow-x:auto;flex-shrink:0;
}
.toolbar::-webkit-scrollbar{height:0}
.tab{padding:4px 12px;border-radius:20px;font-size:12.5px;font-weight:500;color:var(--text2);cursor:pointer;border:1px solid transparent;white-space:nowrap;transition:all .12s;background:none}
.tab:hover{background:var(--bg);color:var(--text)}
.tab.on{background:var(--accent-l);color:var(--accent);border-color:#bfdbfe}
.tab .cnt{font-size:10.5px;margin-left:4px;background:var(--bg);color:var(--text3);padding:0px 5px;border-radius:10px}
.tab.on .cnt{background:#bfdbfe;color:var(--accent)}
.tb-sep{width:1px;height:20px;background:var(--border);flex-shrink:0;margin:0 2px}
.filter-sel{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:4px 8px;font-size:12.5px;color:var(--text);outline:none;cursor:pointer}
.filter-sel:focus{border-color:var(--accent)}

/* MAIN */
.main{flex:1;padding:16px 20px 40px;overflow:hidden}

/* TABLE */
.table-wrap{background:var(--white);border:1px solid var(--border);border-radius:8px;box-shadow:var(--sh);overflow:hidden}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{background:var(--bg)}
thead th{
  padding:9px 12px;text-align:left;
  font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  color:var(--text3);border-bottom:1px solid var(--border);
  white-space:nowrap;user-select:none;cursor:pointer;
}
thead th:hover{color:var(--text2)}
thead th.asc::after{content:' ↑';color:var(--accent)}
thead th.desc::after{content:' ↓';color:var(--accent)}
thead th:first-child{width:36px;text-align:center;cursor:default}
thead th:last-child{width:44px;text-align:center;cursor:default}

tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:#fafafa}
tbody tr.done-row{opacity:.5}
tbody tr.od-row{background:#fffbfb}

tbody td{padding:9px 12px;vertical-align:middle}
td:first-child{text-align:center;width:36px}
td:last-child{text-align:center;width:44px}

/* CHECK */
.ck{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border2);background:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:8px;color:transparent;transition:all .14s;flex-shrink:0}
.ck:hover{border-color:var(--accent);background:var(--accent-l)}
.ck.on{background:#16a34a;border-color:#16a34a;color:var(--white)}

/* TITLE */
.t-cell{min-width:160px}
.t-name{font-weight:500;color:var(--text);cursor:pointer;line-height:1.4}
.t-name:hover{color:var(--accent);text-decoration:underline}
.t-name.s{text-decoration:line-through;color:var(--text3);font-weight:400}
.t-desc{font-size:11px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.t-tags{display:flex;gap:3px;flex-wrap:wrap;margin-top:3px}
.tag{font-size:10px;padding:1px 5px;border-radius:3px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}

/* DUE */
.due{font-size:12px;white-space:nowrap}
.due.od{color:#dc2626;font-weight:600}
.due.soon{color:#d97706;font-weight:500}
.due.fine{color:var(--text3)}

/* PILL */
.pill{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;cursor:pointer;white-space:nowrap;transition:all .12s;border:1px solid transparent;user-select:none}
.pill:hover{opacity:.8}
.dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}

.p-ns  {background:#f3f4f6;color:#374151;border-color:#d1d5db}.p-ns   .dot{background:#9ca3af}
.p-ip  {background:#fef3c7;color:#92400e;border-color:#fcd34d}.p-ip   .dot{background:#d97706}
.p-dn  {background:#dcfce7;color:#166534;border-color:#86efac}.p-dn   .dot{background:#16a34a}
.p-nb  {background:#f3f4f6;color:#374151;border-color:#d1d5db}.p-nb   .dot{background:#9ca3af}
.p-bi  {background:#dbeafe;color:#1e40af;border-color:#93c5fd}.p-bi   .dot{background:#2563eb}
.p-nr  {background:#f3f4f6;color:#374151;border-color:#d1d5db}.p-nr   .dot{background:#9ca3af}
.p-rc  {background:#cffafe;color:#0e7490;border-color:#67e8f9}.p-rc   .dot{background:#0891b2}
.p-low {background:#dcfce7;color:#166534;border-color:#86efac}.p-low  .dot{background:#16a34a}
.p-med {background:#fef3c7;color:#92400e;border-color:#fcd34d}.p-med  .dot{background:#d97706}
.p-high{background:#fee2e2;color:#991b1b;border-color:#fca5a5}.p-high .dot{background:#dc2626}
.p-urg {background:#fff1f2;color:#9f1239;border-color:#fda4af}.p-urg  .dot{background:#e11d48}

/* ROW ACTIONS */
.ra{display:flex;align-items:center;justify-content:center;gap:2px;opacity:0;transition:opacity .1s}
tbody tr:hover .ra{opacity:1}
.ra-btn{background:none;border:none;cursor:pointer;color:var(--text3);font-size:14px;padding:3px 5px;border-radius:4px;transition:all .1s}
.ra-btn:hover{background:var(--bg);color:var(--text)}
.ra-btn.del:hover{background:#fee2e2;color:#dc2626}

/* EMPTY */
.empty-row td{padding:52px 20px;text-align:center;color:var(--text3)}
.ei{font-size:28px;margin-bottom:8px}
.et{font-size:14px;font-weight:500;color:var(--text2);margin-bottom:3px}
.es{font-size:12px}

/* TABLE FOOTER */
.tfoot{
  padding:8px 14px;border-top:1px solid var(--border);background:var(--bg);
  display:flex;align-items:center;justify-content:space-between;
  font-size:12px;color:var(--text3);gap:8px;flex-wrap:wrap;
}
.fstats{display:flex;gap:14px}
.fs-item{display:flex;align-items:center;gap:4px}
.fs-dot{width:6px;height:6px;border-radius:50%}

/* MODAL */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.ov.open{display:flex}
.modal{background:var(--white);border-radius:10px;padding:24px;width:100%;max-width:480px;box-shadow:var(--sh2);animation:mdin .2s cubic-bezier(.34,1.2,.64,1);max-height:92vh;overflow-y:auto}
@keyframes mdin{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.m-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.m-title{font-size:16px;font-weight:700}
.m-close{background:none;border:none;cursor:pointer;color:var(--text3);font-size:18px;padding:2px 6px;border-radius:5px;transition:all .12s}
.m-close:hover{background:var(--bg);color:var(--text)}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:11px;font-weight:600;color:var(--text3);margin-bottom:5px;letter-spacing:.03em;text-transform:uppercase}
.fi,.ft,.fs{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:8px 10px;font-size:13px;color:var(--text);outline:none;transition:all .14s;-webkit-appearance:none}
.fi:focus,.ft:focus,.fs:focus{background:var(--white);border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.fi::placeholder,.ft::placeholder{color:var(--text3)}
.ft{resize:vertical;min-height:64px;line-height:1.5}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}

/* MOBILE — card layout */
@media(max-width:700px){
  .main{padding:10px 12px 40px}
  .header{padding:0 12px}
  .toolbar{padding:0 12px}
  .header-mid{flex:1}
  .sync-pill .sync-txt{display:none}
  table,thead,tbody,tr,th,td{display:block}
  thead{display:none}
  .table-scroll{overflow-x:unset}
  tbody tr{border:1px solid var(--border);border-radius:8px;margin-bottom:8px;padding:11px 13px;background:var(--white)}
  tbody tr:hover{background:var(--white)}
  tbody td{padding:3px 0;border:none}
  td:first-child{display:flex;align-items:center;gap:8px;padding:0 0 8px}
  td:last-child{display:flex;justify-content:flex-end;padding-top:8px;margin-top:4px;border-top:1px solid var(--border)}
  .ra{opacity:1}
  .t-desc{max-width:100%}
  .table-wrap{background:transparent;border:none;box-shadow:none;border-radius:0}
  .tfoot{border:1px solid var(--border);border-top:none;border-radius:0 0 8px 8px}
  .fg2{grid-template-columns:1fr 1fr}
  .modal{padding:18px}
  .logo-txt{display:none}
}
@media(max-width:380px){
  .fg2{grid-template-columns:1fr}
}

/* TOAST */
.toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:#1f2937;color:var(--white);font-size:12.5px;font-weight:500;padding:8px 16px;border-radius:20px;box-shadow:var(--sh2);animation:tin .2s ease;white-space:nowrap}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.toast.ok{background:#15803d}.toast.err{background:#dc2626}

/* SPINNER */
.spin-ov{position:fixed;inset:0;background:rgba(255,255,255,.55);z-index:500;display:none;align-items:center;justify-content:center}
.spin-ov.show{display:flex}
.spin{width:26px;height:26px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:ro .6s linear infinite}
@keyframes ro{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="ls" id="ls">
  <div class="ls-icon">📋</div>
  <div class="ls-txt">Loading TaskTracker…</div>
  <div class="ls-bar"><div class="ls-fill"></div></div>
</div>

<div class="spin-ov" id="spin-ov"><div class="spin"></div></div>

<div class="shell">

  <!-- HEADER -->
  <header class="header">
    <div class="logo">
      <div class="logo-sq">T</div>
      <span class="logo-txt">TaskTracker</span>
    </div>
    <div class="header-mid">
      <div class="sw">
        <span class="si">⌕</span>
        <input id="search" type="text" placeholder="Search tasks…" oninput="rc()"/>
      </div>
    </div>
    <div class="header-right">
      <div class="sync-pill">
        <div class="sd" id="sd"></div>
        <span id="sm" class="sync-txt">Connecting…</span>
        <span id="cd" style="font-size:10px;margin-left:2px"></span>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="doSync()" title="Sync now">↻</button>
      <button class="btn btn-primary" onclick="openModal()">+ New task</button>
    </div>
  </header>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <button class="tab on" onclick="setTab('all',this)">All <span class="cnt" id="cnt-all">0</span></button>
    <button class="tab" onclick="setTab('inprogress',this)">In progress <span class="cnt" id="cnt-ip">0</span></button>
    <button class="tab" onclick="setTab('notstarted',this)">Not started <span class="cnt" id="cnt-ns">0</span></button>
    <button class="tab" onclick="setTab('completed',this)">Completed <span class="cnt" id="cnt-dn">0</span></button>
    <button class="tab" onclick="setTab('overdue',this)">⚑ Overdue <span class="cnt" id="cnt-od">0</span></button>
    <button class="tab" onclick="setTab('unbilled',this)">Unbilled <span class="cnt" id="cnt-ub">0</span></button>
    <button class="tab" onclick="setTab('unpaid',this)">Unpaid <span class="cnt" id="cnt-up">0</span></button>
    <div class="tb-sep"></div>
    <select class="filter-sel" id="pf" onchange="rc()">
      <option value="">All priorities</option>
      <option value="Urgent">Urgent</option>
      <option value="High">High</option>
      <option value="Medium">Medium</option>
      <option value="Low">Low</option>
    </select>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="table-wrap">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th></th>
              <th onclick="sort('title')">Task</th>
              <th onclick="sort('status')">Status</th>
              <th onclick="sort('priority')">Priority</th>
              <th onclick="sort('due_date')">Due date</th>
              <th onclick="sort('billing_status')">Billing</th>
              <th onclick="sort('payment_status')">Payment</th>
              <th onclick="sort('updated_at')">Updated</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="tfoot">
        <span id="foot-cnt">0 tasks</span>
        <div class="fstats" id="fstats"></div>
      </div>
    </div>
  </div>

</div>

<!-- MODAL -->
<div class="ov" id="mov" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="m-hdr">
      <div class="m-title" id="m-title">New task</div>
      <button class="m-close" onclick="closeModal()">✕</button>
    </div>
    <div class="fg"><label>Title <span style="color:#dc2626">*</span></label><input class="fi" id="f-title" placeholder="What needs to be done?"/></div>
    <div class="fg"><label>Description</label><textarea class="ft" id="f-desc" placeholder="Optional notes…"></textarea></div>
    <div class="fg2">
      <div class="fg"><label>Status</label><select class="fs" id="f-status"><option>Not Started</option><option>In Progress</option><option>Completed</option></select></div>
      <div class="fg"><label>Priority</label><select class="fs" id="f-priority"><option>Low</option><option selected>Medium</option><option>High</option><option>Urgent</option></select></div>
    </div>
    <div class="fg2">
      <div class="fg"><label>Billing</label><select class="fs" id="f-billing"><option>Not Billed</option><option>Billed</option></select></div>
      <div class="fg"><label>Payment</label><select class="fs" id="f-payment"><option>Not Received</option><option>Received</option></select></div>
    </div>
    <div class="fg2">
      <div class="fg"><label>Due date</label><input class="fi" id="f-due" type="date"/></div>
      <div class="fg"><label>Tags <span style="color:var(--text3);font-weight:400;text-transform:none;letter-spacing:0">(comma separated)</span></label><input class="fi" id="f-tags" placeholder="design, client…"/></div>
    </div>
    <div class="m-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="save-btn" onclick="saveTask()">Save task</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
// ── HARDCODED URL ─────────────────────────────────────────────
const GS = 'https://script.google.com/macros/s/AKfycbz6ybkbfJdyUGGkJd36C0qXTtAuwcwMxK4AfE3hcW6fYFAQXbi69wAKiHe0vvV3ctkJ/exec';
const POLL = 30000;

// ── LOOKUPS ───────────────────────────────────────────────────
const PC = {
  'Not Started':'p-ns','In Progress':'p-ip','Completed':'p-dn',
  'Not Billed':'p-nb','Billed':'p-bi',
  'Not Received':'p-nr','Received':'p-rc',
  'Low':'p-low','Medium':'p-med','High':'p-high','Urgent':'p-urg',
};
const CYCLES = {
  status:         ['Not Started','In Progress','Completed'],
  billing_status: ['Not Billed','Billed'],
  payment_status: ['Not Received','Received'],
  priority:       ['Low','Medium','High','Urgent'],
};
const P_ORD = ['Urgent','High','Medium','Low'];

// ── STATE ─────────────────────────────────────────────────────
let tasks=[], curTab='all', editId=null, saving=false;
let sCol='updated_at', sDir='desc';
let pollTimer=null, cdTimer=null, nextAt=0;

// ── INIT ──────────────────────────────────────────────────────
async function init(){
  tasks = local();
  rc();
  setSS('busy','Connecting…');
  await doSync();
  hideLoader();
  startPoll();
}
function local(){ try{ return JSON.parse(localStorage.getItem('tt_v5')||'[]') }catch(e){ return [] } }
function save(){ localStorage.setItem('tt_v5', JSON.stringify(tasks)) }
function hideLoader(){ const e=document.getElementById('ls'); e.classList.add('hide'); setTimeout(()=>e.style.display='none',380) }

// ── POLLING ───────────────────────────────────────────────────
function startPoll(){ sched() }
function sched(){
  clearTimeout(pollTimer); clearInterval(cdTimer);
  nextAt = Date.now() + POLL;
  pollTimer = setTimeout(async()=>{ await doSync(); sched(); }, POLL);
  cdTimer = setInterval(()=>{
    const s = Math.max(0, Math.round((nextAt-Date.now())/1000));
    const el = document.getElementById('cd');
    if(el) el.textContent = s > 0 ? `${s}s` : '';
  }, 1000);
}
function quickPoll(){
  clearTimeout(pollTimer);
  pollTimer = setTimeout(async()=>{ await doSync(); sched(); }, 1500);
}

// ── API ───────────────────────────────────────────────────────
async function api(params){
  const url = GS + '?' + new URLSearchParams(params).toString();
  const r = await fetch(url);
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j = await r.json();
  if(!j.ok) throw new Error(j.error||'API error');
  return j.data;
}

async function doSync(){
  setSS('busy','Syncing…');
  try{
    const data = await api({ action:'getAll', t:Date.now() });
    tasks = data.map(norm);
    save(); rc();
    setSS('ok','Synced · '+ft(new Date()));
  }catch(e){
    setSS('err','Offline — local data');
    if(!tasks.length){ tasks = seed(); save(); rc(); }
  }
}

async function apiWrite(params){
  showSpin(true);
  try{
    const data = await api(params);
    tasks = data.map(norm);
    save(); rc(); counts();
    setSS('ok','Saved · '+ft(new Date()));
    quickPoll();
  }catch(e){
    setSS('err','Save failed');
    toast('Save failed — check connection','err');
  }finally{
    showSpin(false);
  }
}

function showSpin(v){ document.getElementById('spin-ov').classList.toggle('show',v) }
function setSS(s,m){ document.getElementById('sd').className='sd '+s; document.getElementById('sm').textContent=m }

function norm(t){
  return {
    id:             String(t.id||uid()),
    title:          String(t.title||''),
    description:    String(t.description||''),
    status:         t.status         ||'Not Started',
    billing_status: t.billing_status ||'Not Billed',
    payment_status: t.payment_status ||'Not Received',
    priority:       t.priority       ||'Medium',
    due_date:       t.due_date       ||'',
    tags:           t.tags           ||'',
    created_at:     t.created_at     ||new Date().toISOString(),
    updated_at:     t.updated_at     ||new Date().toISOString(),
  };
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7) }

// ── CRUD ──────────────────────────────────────────────────────
async function createTask(t){
  tasks.unshift(t); save(); rc(); counts();
  await apiWrite({ action:'create', task:encodeURIComponent(JSON.stringify(t)) });
}
async function updateTask(id, ch){
  const t=tasks.find(x=>x.id===id); if(!t)return;
  Object.assign(t, ch, { updated_at:new Date().toISOString() });
  save(); rc(); counts();
  await apiWrite({ action:'update', task:encodeURIComponent(JSON.stringify(tasks.find(x=>x.id===id))) });
}
async function deleteTask(id){
  tasks=tasks.filter(x=>x.id!==id);
  save(); rc(); counts();
  await apiWrite({ action:'delete', id });
}

// ── MODAL ─────────────────────────────────────────────────────
function openModal(id){
  editId=id||null;
  document.getElementById('m-title').textContent=id?'Edit task':'New task';
  if(id){
    const t=tasks.find(x=>x.id===id);
    document.getElementById('f-title').value=t.title;
    document.getElementById('f-desc').value=t.description||'';
    document.getElementById('f-status').value=t.status;
    document.getElementById('f-priority').value=t.priority||'Medium';
    document.getElementById('f-billing').value=t.billing_status;
    document.getElementById('f-payment').value=t.payment_status;
    document.getElementById('f-due').value=t.due_date||'';
    document.getElementById('f-tags').value=t.tags||'';
  }else{
    ['f-title','f-desc','f-due','f-tags'].forEach(i=>document.getElementById(i).value='');
    document.getElementById('f-status').value='Not Started';
    document.getElementById('f-priority').value='Medium';
    document.getElementById('f-billing').value='Not Billed';
    document.getElementById('f-payment').value='Not Received';
  }
  document.getElementById('mov').classList.add('open');
  setTimeout(()=>document.getElementById('f-title').focus(),80);
}
function closeModal(){ document.getElementById('mov').classList.remove('open') }

async function saveTask(){
  if(saving)return;
  const title=document.getElementById('f-title').value.trim();
  if(!title){ document.getElementById('f-title').focus(); return; }
  saving=true;
  const btn=document.getElementById('save-btn');
  btn.textContent='Saving…'; btn.disabled=true;
  const now=new Date().toISOString();
  const tags=document.getElementById('f-tags').value.split(',').map(s=>s.trim()).filter(Boolean).join(',');
  const p={
    title,
    description:    document.getElementById('f-desc').value.trim(),
    status:         document.getElementById('f-status').value,
    priority:       document.getElementById('f-priority').value,
    billing_status: document.getElementById('f-billing').value,
    payment_status: document.getElementById('f-payment').value,
    due_date:       document.getElementById('f-due').value,
    tags,
  };
  closeModal();
  if(editId){ await updateTask(editId,p); toast('Task updated','ok'); }
  else { await createTask({ id:uid(),...p,created_at:now,updated_at:now }); toast('Task created','ok'); }
  saving=false; btn.textContent='Save task'; btn.disabled=false;
}

// ── QUICK ACTIONS ─────────────────────────────────────────────
async function toggleDone(id){
  const t=tasks.find(x=>x.id===id); if(!t)return;
  const next=t.status==='Completed'?'Not Started':'Completed';
  await updateTask(id,{status:next});
  toast(next==='Completed'?'Marked complete ✓':'Reopened',next==='Completed'?'ok':'');
}
async function cycleField(id,field){
  const t=tasks.find(x=>x.id===id); if(!t)return;
  const opts=CYCLES[field];
  const next=opts[(opts.indexOf(t[field])+1)%opts.length];
  await updateTask(id,{[field]:next});
  toast(next);
}
async function delTask(id){
  const t=tasks.find(x=>x.id===id);
  if(!t||!confirm(`Delete "${t.title}"?`))return;
  await deleteTask(id); toast('Deleted');
}

// ── HELPERS ───────────────────────────────────────────────────
function isOD(t){ return t.due_date&&t.status!=='Completed'&&new Date(t.due_date)<new Date(new Date().toDateString()) }
function isSoon(t){ if(!t.due_date||t.status==='Completed')return false; const d=(new Date(t.due_date)-new Date())/864e5; return d>=0&&d<=2 }

// ── RENDER ────────────────────────────────────────────────────
function rc(){ renderTable(); counts(); }

function getVisible(){
  const q=(document.getElementById('search').value||'').toLowerCase().trim();
  const pf=document.getElementById('pf').value;
  let rows=[...tasks];
  if(curTab==='inprogress') rows=rows.filter(t=>t.status==='In Progress');
  else if(curTab==='notstarted') rows=rows.filter(t=>t.status==='Not Started');
  else if(curTab==='completed') rows=rows.filter(t=>t.status==='Completed');
  else if(curTab==='overdue') rows=rows.filter(isOD);
  else if(curTab==='unbilled') rows=rows.filter(t=>t.billing_status==='Not Billed');
  else if(curTab==='unpaid') rows=rows.filter(t=>t.billing_status==='Billed'&&t.payment_status==='Not Received');
  if(pf) rows=rows.filter(t=>t.priority===pf);
  if(q) rows=rows.filter(t=>t.title.toLowerCase().includes(q)||(t.description||'').toLowerCase().includes(q)||(t.tags||'').toLowerCase().includes(q));
  rows.sort((a,b)=>{
    let av=a[sCol]||'', bv=b[sCol]||'';
    if(sCol==='priority'){ av=P_ORD.indexOf(av); bv=P_ORD.indexOf(bv); }
    if(av<bv)return sDir==='asc'?-1:1;
    if(av>bv)return sDir==='asc'?1:-1;
    return 0;
  });
  return rows;
}

function renderTable(){
  const rows=getVisible();
  const tbody=document.getElementById('tbody');
  tbody.innerHTML='';
  if(!rows.length){
    tbody.innerHTML=`<tr class="empty-row"><td colspan="9">
      <div class="ei">📭</div>
      <div class="et">No tasks found</div>
      <div class="es">Try a different filter or create a new task</div>
    </td></tr>`;
    document.getElementById('foot-cnt').textContent='0 tasks';
    document.getElementById('fstats').innerHTML='';
    return;
  }
  rows.forEach(t=>{
    const od=isOD(t), soon=isSoon(t);
    const tr=document.createElement('tr');
    if(t.status==='Completed') tr.classList.add('done-row');
    if(od) tr.classList.add('od-row');
    const tags=(t.tags||'').split(',').map(s=>s.trim()).filter(Boolean);
    const tagsHtml=tags.length?`<div class="t-tags">${tags.map(g=>`<span class="tag">${esc(g)}</span>`).join('')}</div>`:'';
    let dueHtml='<span style="color:var(--text3)">—</span>';
    if(t.due_date){
      const cls=od?'od':soon?'soon':'fine';
      const ico=od?'⚑ ':soon?'◷ ':'';
      dueHtml=`<div class="due ${cls}">${ico}${fmtDate(t.due_date)}</div>`;
    }
    tr.innerHTML=`
      <td><button class="ck${t.status==='Completed'?' on':''}" onclick="toggleDone('${t.id}')">${t.status==='Completed'?'✓':''}</button></td>
      <td>
        <div class="t-cell">
          <div class="t-name${t.status==='Completed'?' s':''}" onclick="openModal('${t.id}')">${esc(t.title)}</div>
          ${t.description?`<div class="t-desc">${esc(t.description)}</div>`:''}
          ${tagsHtml}
        </div>
      </td>
      <td><span class="pill ${PC[t.status]}" onclick="cycleField('${t.id}','status')"><span class="dot"></span>${t.status}</span></td>
      <td><span class="pill ${PC[t.priority||'Medium']}" onclick="cycleField('${t.id}','priority')"><span class="dot"></span>${t.priority||'Medium'}</span></td>
      <td>${dueHtml}</td>
      <td><span class="pill ${PC[t.billing_status]}" onclick="cycleField('${t.id}','billing_status')"><span class="dot"></span>${t.billing_status}</span></td>
      <td><span class="pill ${PC[t.payment_status]}" onclick="cycleField('${t.id}','payment_status')"><span class="dot"></span>${t.payment_status}</span></td>
      <td style="color:var(--text3);font-size:12px;white-space:nowrap">${fd(t.updated_at)}</td>
      <td><div class="ra">
        <button class="ra-btn" onclick="openModal('${t.id}')" title="Edit">✎</button>
        <button class="ra-btn del" onclick="delTask('${t.id}')" title="Delete">✕</button>
      </div></td>`;
    tbody.appendChild(tr);
  });
  const done=rows.filter(t=>t.status==='Completed').length;
  const billed=rows.filter(t=>t.billing_status==='Billed').length;
  const paid=rows.filter(t=>t.payment_status==='Received').length;
  document.getElementById('foot-cnt').textContent=`${rows.length} task${rows.length!==1?'s':''}`;
  document.getElementById('fstats').innerHTML=`
    <div class="fs-item"><div class="fs-dot" style="background:#16a34a"></div>${done} completed</div>
    <div class="fs-item"><div class="fs-dot" style="background:#2563eb"></div>${billed} billed</div>
    <div class="fs-item"><div class="fs-dot" style="background:#0891b2"></div>${paid} paid</div>`;
}

// ── SORT ──────────────────────────────────────────────────────
function sort(col){
  if(sCol===col) sDir=sDir==='asc'?'desc':'asc';
  else{ sCol=col; sDir='asc'; }
  const colMap=['','title','status','priority','due_date','billing_status','payment_status','updated_at',''];
  document.querySelectorAll('thead th').forEach((th,i)=>{
    th.classList.remove('asc','desc');
    if(colMap[i]===col) th.classList.add(sDir==='asc'?'asc':'desc');
  });
  rc();
}

// ── TABS ──────────────────────────────────────────────────────
function setTab(tab, btn){
  curTab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  btn.classList.add('on');
  rc();
}

// ── COUNTS ────────────────────────────────────────────────────
function counts(){
  const s=(id,v)=>{ const e=document.getElementById(id); if(e) e.textContent=v };
  s('cnt-all',  tasks.length);
  s('cnt-ip',   tasks.filter(t=>t.status==='In Progress').length);
  s('cnt-ns',   tasks.filter(t=>t.status==='Not Started').length);
  s('cnt-dn',   tasks.filter(t=>t.status==='Completed').length);
  s('cnt-od',   tasks.filter(isOD).length);
  s('cnt-ub',   tasks.filter(t=>t.billing_status==='Not Billed').length);
  s('cnt-up',   tasks.filter(t=>t.billing_status==='Billed'&&t.payment_status==='Not Received').length);
}

// ── TOAST ─────────────────────────────────────────────────────
function toast(msg,type=''){
  const el=document.createElement('div');
  el.className='toast'+(type?' '+type:'');
  el.textContent=msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>el.remove(),2400);
}

// ── UTILS ─────────────────────────────────────────────────────
function esc(s){ return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }
function fd(iso){ try{ return new Date(iso).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'2-digit'}) }catch(e){ return '—' } }
function fmtDate(s){ try{ const[y,m,d]=s.split('-'); return new Date(y,m-1,d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'2-digit'}) }catch(e){ return s||'—' } }
function ft(d){ return d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) }

function seed(){
  const ago=n=>{ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString() };
  const due=n=>{ const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10) };
  return [
    {id:uid(),title:'Design homepage wireframes',description:'Lo-fi mockups for client review',status:'Completed',priority:'High',billing_status:'Billed',payment_status:'Received',due_date:due(-5),tags:'design,client',created_at:ago(12),updated_at:ago(4)},
    {id:uid(),title:'Build REST API endpoints',description:'CRUD for tasks and users',status:'In Progress',priority:'Urgent',billing_status:'Not Billed',payment_status:'Not Received',due_date:due(-1),tags:'backend',created_at:ago(5),updated_at:ago(1)},
    {id:uid(),title:'Write test suite',description:'',status:'Not Started',priority:'Medium',billing_status:'Not Billed',payment_status:'Not Received',due_date:due(3),tags:'testing',created_at:ago(3),updated_at:ago(3)},
    {id:uid(),title:'Client kickoff presentation',description:'Slides and agenda prep',status:'Completed',priority:'High',billing_status:'Billed',payment_status:'Received',due_date:due(-8),tags:'client',created_at:ago(14),updated_at:ago(7)},
    {id:uid(),title:'Deploy to production',description:'Vercel + environment config',status:'Not Started',priority:'Low',billing_status:'Not Billed',payment_status:'Not Received',due_date:due(7),tags:'devops',created_at:ago(2),updated_at:ago(2)},
  ];
}

// ── KEYBOARD ──────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeModal();
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){ e.preventDefault(); document.getElementById('search').focus(); }
  if((e.metaKey||e.ctrlKey)&&e.key==='n'){ e.preventDefault(); openModal(); }
});

init();
</script>
</body>
</html>
